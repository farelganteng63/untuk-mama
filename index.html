<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Mama</title>
<style>
body{margin:0; background:#0a0a1a; overflow:hidden; font-family:Arial;}
canvas{display:block;}
#btn{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#4db8ff; color:white; border:none; padding:14px 28px; border-radius:30px; font-size:16px; z-index:10; cursor:pointer;}
</style>
</head>
<body>
<button id="btn" onclick="playMusic()">🎵 KLIK DULU MA, ADA MUSIKNYA 🎵</button>
<canvas id="c"></canvas>
<audio id="musik" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
function playMusic(){
  const m=document.getElementById('musik');
  m.volume=0.7;
  m.play().then(()=>{ document.getElementById('btn').innerText='❤️ Musik diputer buat Mama ❤️'; setTimeout(()=>{document.getElementById('btn').style.display='none'},1500); })
  .catch(()=>{ alert('Aktifkan suara di HP ya Ma!'); m.play(); });
}
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
const lyrics=["Selamat Ulang Tahun, Mama! 🎂","Shape of My Heart ❤️","Terima kasih Mama","Sehat Selalu","Aku Sayang Mama"];
let hearts=[];
function Heart(x,y,txt){ this.x=x; this.y=y; this.txt=txt||""; this.size=Math.random()*70+35; this.speed=Math.random()*1.2+0.6; this.alpha=1; }
Heart.prototype.draw=function(){ ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle="#4db8ff"; ctx.beginPath(); let s=this.size; ctx.moveTo(this.x,this.y); ctx.bezierCurveTo(this.x-s/2,this.y-s/2,this.x-s,this.y+s/3,this.x,this.y+s); ctx.bezierCurveTo(this.x+s,this.y+s/3,this.x+s/2,this.y-s/2,this.x,this.y); ctx.fill(); if(this.txt){ ctx.fillStyle="white"; ctx.font="bold 11px Arial"; ctx.textAlign="center"; ctx.fillText(this.txt,this.x,this.y+s/3); } ctx.restore(); }
Heart.prototype.update=function(){ this.y-=this.speed; this.alpha-=0.0015; this.draw(); }
function anim(){ ctx.fillStyle="rgba(10,10,26,0.18)"; ctx.fillRect(0,0,canvas.width,canvas.height); if(Math.random()<0.07){ let txt=lyrics[Math.floor(Math.random()*lyrics.length)]; hearts.push(new Heart(Math.random()*canvas.width, canvas.height+60, txt)); } hearts.forEach((h,i)=>{ h.update(); if(h.y<-150) hearts.splice(i,1); }); if(Math.random()<0.2){ let h=new Heart(Math.random()*canvas.width,Math.random()*canvas.height); h.size=10; h.speed=0.3; hearts.push(h); } requestAnimationFrame(anim); }
anim();
</script>
</body>
</html>
