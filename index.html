<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Mama Tercinta</title>
<style>
body{margin:0; background:#0a0a1a; overflow:hidden; font-family:Arial;}
canvas{display:block;}
#lyrics{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:white; text-align:center; font-size:22px; text-shadow:0 0 10px #00aaff; pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lyrics"></div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
const lyrics=[
"Selamat Ulang Tahun, Mama! 🎂",
"Got nothing to hide no more...",
"I don't know where to start",
"But to show you the shape of my heart ❤️",
"Terima kasih Mama...",
"Sudah jadi yang terbaik",
"Aku sayang Mama selamanya"
];
let hearts=[];
function Heart(x,y,txt){
  this.x=x; this.y=y; this.txt=txt||""; this.size=Math.random()*60+40;
  this.speed=Math.random()*1+0.5; this.alpha=1;
}
Heart.prototype.draw=function(){
  ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle="#4db8ff";
  ctx.beginPath();
  let s=this.size;
  ctx.moveTo(this.x,this.y);
  ctx.bezierCurveTo(this.x-s/2,this.y-s/2,this.x-s,this.y+s/3,this.x,this.y+s);
  ctx.bezierCurveTo(this.x+s,this.y+s/3,this.x+s/2,this.y-s/2,this.x,this.y);
  ctx.fill();
  if(this.txt){ ctx.fillStyle="white"; ctx.font="12px Arial"; ctx.textAlign="center"; ctx.fillText(this.txt,this.x,this.y+s/3); }
  ctx.restore();
}
Heart.prototype.update=function(){ this.y-=this.speed; this.alpha-=0.002; this.draw(); }
function anim(){
  ctx.fillStyle="rgba(10,10,26,0.2)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(Math.random()<0.05){
    let txt=lyrics[Math.floor(Math.random()*lyrics.length)];
    hearts.push(new Heart(Math.random()*canvas.width, canvas.height+50, txt));
  }
  hearts.forEach((h,i)=>{ h.update(); if(h.y<-100) hearts.splice(i,1); });
  for(let i=0;i<5;i++){ if(Math.random()<0.1){ let h=new Heart(Math.random()*canvas.width,Math.random()*canvas.height); h.size=8; h.speed=Math.random()*0.5+0.2; hearts.push(h);} }
  requestAnimationFrame(anim);
}
anim();
window.onresize=()=>{ canvas.width=innerWidth; canvas.height=innerHeight; }
</script>
</body>
</html>
